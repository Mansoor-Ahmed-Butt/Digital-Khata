name: digital_khata
description: Credit ledger (udhaar) for small shops with one-tap payment reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management, routing, DI (replaces Riverpod + go_router)
  get: ^4.6.6

  # Local, offline-first storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Security
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # Device integrations
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2
  share_plus: ^10.0.2
  file_picker: ^8.1.2

  # Documents
  pdf: ^3.11.1
  printing: ^5.13.1

  # Formatting (version is pinned by flutter_localizations)
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
